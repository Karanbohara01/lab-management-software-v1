server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Static assets: content-hashed filenames from the Vite build, safe to cache hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Everything under /api is the backend — proxied so the frontend can call a same-origin
    # relative "/api" URL (see src/api/client.ts) without needing a rebuild per environment.
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Client-side routing (React Router) — any path that isn't a real file falls back to
    # index.html so the app's own router can handle it.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
