<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="/logo-mark.svg" />
    <script>
      // Set the theme class before React mounts, so the first paint is already correct — avoids
      // a flash of the wrong theme. Mirrors useTheme.ts's own logic; kept tiny/inline since it
      // must run before any stylesheet or module loads. The landing page, the blog and the sign-in
      // pages (login, signup, forgot/reset password) are always light (useForcedLightTheme), so
      // they skip the dark class here — keep these paths in sync with the pages that call that
      // hook. ('/solutions' is only a redirect to the landing page, listed so it doesn't flash dark.)
      (function () {
        try {
          var path = window.location.pathname.replace(/\/+$/, '');
          var lightPaths = ['', '/solutions', '/login', '/signup', '/forgot-password', '/reset-password'];
          if (lightPaths.indexOf(path) !== -1 || path === '/blog' || path.indexOf('/blog/') === 0) {
            document.documentElement.style.colorScheme = 'light';
            document.documentElement.classList.add('theme-lims'); // the logo's colours, from the first paint
            return;
          }
          var stored = localStorage.getItem('lims-theme');
          var dark =
            stored === 'dark' ||
            (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
    <!-- Fonts are requested from here rather than an @import inside the bundled CSS, so the browser
         discovers them one round-trip earlier. Inter is requested with its optical-size axis so large
         headings get the display cut instead of the text cut scaled up. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <title>Pathology Management Software | LIMS</title>
    <meta
      name="description"
      content="LIMS is a laboratory information management system for pathology labs, diagnostic centers and hospital laboratories — patients, orders, samples, results, reports, billing and e-Billing in one connected platform."
    />
    <meta property="og:title" content="Pathology Management Software | LIMS" />
    <meta
      property="og:description"
      content="Manage patients, laboratory orders, samples, results, reports, billing, payments and e-Billing workflows from one connected platform."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
