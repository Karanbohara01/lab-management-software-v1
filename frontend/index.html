<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Set the theme class before React mounts, so the first paint is already correct — avoids
      // a flash of the wrong theme. Mirrors useTheme.ts's own logic; kept tiny/inline since it
      // must run before any stylesheet or module loads.
      (function () {
        try {
          var stored = localStorage.getItem('lims-theme');
          var dark =
            stored === 'dark' ||
            (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
    <title>Pathology Management Software | LabOS</title>
    <meta
      name="description"
      content="LabOS is a laboratory information management system for pathology labs, diagnostic centers and hospital laboratories — patients, orders, samples, results, reports, billing and e-Billing in one connected platform."
    />
    <meta property="og:title" content="Pathology Management Software | LabOS" />
    <meta
      property="og:description"
      content="Manage patients, laboratory orders, samples, results, reports, billing, payments and e-Billing workflows from one connected platform."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
