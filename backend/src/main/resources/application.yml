spring:
  application:
    name: lims-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/lims?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:lims}
    password: ${DB_PASSWORD:lims}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
        one-indexed-parameters: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      show-components: never

lims:
  security:
    jwt:
      # Override in application-local.yml / env for anything but throwaway local dev.
      secret: ${JWT_SECRET:change-me-dev-only-secret-change-me-dev-only-secret}
      access-token-ttl: ${JWT_ACCESS_TTL:PT30M}
      refresh-token-ttl: ${JWT_REFRESH_TTL:P7D}
      issuer: lims-backend
  cors:
    # Comma-separated origin patterns (Spring CorsConfiguration#setAllowedOriginPatterns).
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:[*]}
  ird:
    # IRD / CBMS e-billing is disabled until a verified gateway implementation, seller
    # enrolment and credentials are supplied. When false, nothing is transmitted.
    enabled: ${IRD_ENABLED:false}
    environment: ${IRD_ENVIRONMENT:DISABLED}
    base-url: ${IRD_BASE_URL:}
    username: ${IRD_USERNAME:}
    password: ${IRD_PASSWORD:}
    seller-pan: ${IRD_SELLER_PAN:}

springdoc:
  swagger-ui:
    path: /docs

logging:
  level:
    np.com.lims: INFO
    org.springframework.security: INFO
