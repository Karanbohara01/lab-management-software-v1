# Production-shaped compose: backend + frontend + MySQL, built from this repo's own
# Dockerfiles. For local development, use docker-compose.yml instead (DB + Adminer only, running
# the app itself via `./mvnw spring-boot:run` / `npm run dev` for fast reload).
#
# Required before `docker compose -f docker-compose.prod.yml up -d --build`:
#   1. Copy .env.prod.example to .env.prod and fill in real values (JWT_SECRET at minimum —
#      see docs/ENVIRONMENT.md for what every variable does and what happens if it's left unset).
#   2. Run with --env-file .env.prod, e.g.:
#        docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#
# This file intentionally does NOT set IRD/eSewa/Khalti/SMS/WhatsApp credentials inline — those
# stay in .env.prod, which must never be committed (see its own header comment).
#
# `name:` below is NOT cosmetic — without an explicit distinct project name, `docker compose`
# defaults to naming a project after the current directory, which is the SAME default as
# docker-compose.yml (dev). Confirmed live: running this file without one caused Compose to see
# both files as the same project and remove the running dev `lims-mysql` container as an
# "orphan" on `up`. No data was lost that time only because the dev container's named volume
# happened to have a different name than this file's `lims_mysql_prod_data` and so survived
# untouched — do not rely on that; keep this line.
name: labos-prod

services:
  mysql:
    image: mysql:8.4
    container_name: lims-mysql-prod
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: lims
      MYSQL_USER: lims
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env.prod}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .env.prod}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - lims_mysql_prod_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_ROOT_PASSWORD}", "-uroot"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [lims]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lims-backend-prod
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:mysql://mysql:3306/lims?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: lims
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env.prod}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env.prod — see docs/ENVIRONMENT.md}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:?set APP_PUBLIC_URL in .env.prod, e.g. https://labs.example.com}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-${APP_PUBLIC_URL}}
      # Every one of these is optional — each feature stays honestly disabled until its
      # variables are set. See docs/ENVIRONMENT.md for the full list this app reads.
      IRD_ENABLED: ${IRD_ENABLED:-false}
      IRD_USERNAME: ${IRD_USERNAME:-}
      IRD_PASSWORD: ${IRD_PASSWORD:-}
      IRD_SELLER_PAN: ${IRD_SELLER_PAN:-}
      SMS_PROVIDER: ${SMS_PROVIDER:-}
      SMS_BASE_URL: ${SMS_BASE_URL:-}
      SMS_API_KEY: ${SMS_API_KEY:-}
      SMS_FROM: ${SMS_FROM:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      ESEWA_ENABLED: ${ESEWA_ENABLED:-false}
      ESEWA_MERCHANT_CODE: ${ESEWA_MERCHANT_CODE:-}
      ESEWA_SECRET_KEY: ${ESEWA_SECRET_KEY:-}
      KHALTI_ENABLED: ${KHALTI_ENABLED:-false}
      KHALTI_SECRET_KEY: ${KHALTI_SECRET_KEY:-}
      BACKUP_DIRECTORY: /backups
      BACKUP_CRON: ${BACKUP_CRON:-0 0 2 * * *}
    volumes:
      - lims_backups:/backups
    networks: [lims]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lims-frontend-prod
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${HTTP_PORT:-80}:8080"
    networks: [lims]

networks:
  lims:

volumes:
  lims_mysql_prod_data:
  lims_backups:
