name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: lims
          MYSQL_USER: lims
          MYSQL_PASSWORD: lims
          MYSQL_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h localhost -ulims -plims"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Compile
        run: ./mvnw -q -B compile

      - name: Test
        env:
          DB_URL: jdbc:mysql://localhost:3306/lims?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
          DB_USERNAME: lims
          DB_PASSWORD: lims
          JWT_SECRET: ci-only-secret-never-used-outside-this-workflow
        run: ./mvnw -q -B test

      - name: Package
        run: ./mvnw -q -B -DskipTests package

      - name: Build Docker image
        run: docker build -t lims-backend:ci .

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck + build
        run: npm run build

      - name: Test
        run: npm run test

      - name: Build Docker image
        run: docker build -t lims-frontend:ci .
